<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elie's Custom Furniture Gallery</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #fcf8f0; margin: 0; padding: 20px; color: #333; }
        h1 { margin-bottom: 30px; color: #8b5a2b; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .gallery-item { background: white; border: 2px dashed #8b5a2b; padding: 20px; border-radius: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; text-align: center; }
        .gallery-item:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .folder-title { font-weight: bold; font-size: 18px; color: #8b5a2b; display: block; margin-bottom: 8px; }
        .click-hint { font-size: 13px; color: #777; background: #f5eae0; padding: 4px 10px; border-radius: 20px; display: inline-block; }
        
        /* Interactive Popup Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-window { background: white; padding: 25px; border-radius: 15px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; transform: scale(0.8); transition: transform 0.3s ease; }
        .modal-overlay.active .modal-window { transform: scale(1); }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 28px; background: none; border: none; cursor: pointer; color: #333; }
        .modal-title { margin-top: 0; border-bottom: 2px solid #8b5a2b; padding-bottom: 10px; text-transform: capitalize; color: #8b5a2b; }
        .modal-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        .modal-gallery img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h1>Elie's Furniture Catalogue</h1>

    <div class="gallery-grid">
        <div class="gallery-item" onclick="openFolder('bedroom')">
            <span class="folder-title">🛏️ Master Bedroom Set 6</span>
            <span class="click-hint">Tap to view images</span>
        </div>

        <div class="gallery-item" onclick="openFolder('table')">
            <span class="folder-title">🪑 Custom Dining Tables</span>
            <span class="click-hint">Tap to view images</span>
        </div>

        <div class="gallery-item" onclick="openFolder('tv')">
            <span class="folder-title">📺 TV Units & Lounges</span>
            <span class="click-hint">Tap to view images</span>
        </div>
    </div>

    <!-- The Popup Modal Element Box -->
    <div class="modal-overlay" id="galleryModal" onclick="closeFolder()">
        <div class="modal-window" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeFolder()">&times;</button>
            <h3 class="modal-title" id="modalTitle">Gallery</h3>
            <div class="modal-gallery" id="modalImages"></div>
        </div>
    </div>

    <script>
        // Mapping paths manually to prevent GitHub Pages folder lookup errors
        const folderDatabase = {
            'bedroom': [
                'elee/bedroom(10).jpeg',
                'elee/bedroom(11).jpeg',
                'elee/bedroom(12).jpeg'
            ],
            'table': [
                'table/table(1).jpeg',
                'table/table(2).jpeg',
                'table/table(3).jpeg'
            ],
            'tv': [
                'tv/unit(1).jpg',
                'tv/unit(2).jpg'
            ]
        };

        function openFolder(folderName) {
            const modal = document.getElementById('galleryModal');
            const titleElement = document.getElementById('modalTitle');
            const imagesContainer = document.getElementById('modalImages');

            titleElement.innerText = folderName + " Catalog";
            imagesContainer.innerHTML = '';

            const activeImages = folderDatabase[folderName];

            if (activeImages && activeImages.length > 0) {
                activeImages.forEach(imagePath => {
                    const img = document.createElement('img');
                    img.src = imagePath;
                    img.alt = folderName + " design";
                    img.onerror = function() { this.style.display = 'none'; };
                    imagesContainer.appendChild(img);
                });
            } else {
                imagesContainer.innerHTML = '<p>No image items found.</p>';
            }
            modal.classList.add('active');
        }

        function closeFolder() {
            document.getElementById('galleryModal').classList.remove('active');
        }
    </script>
</body>
</html>
