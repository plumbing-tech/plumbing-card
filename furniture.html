<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Gallery Viewer</title>
    <style>
        /* Base Container & Grid Styling mimicking your UI */
        body {
            font-family: Arial, sans-serif;
            background-color: #fcf8f0;
            margin: 0;
            padding: 20px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            background: #fff;
            border: 1px dashed #dae1e7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .gallery-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .folder-title {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .click-hint {
            font-size: 12px;
            color: #888;
        }

        /* --- POPUP WINDOW MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        /* When active, show modal */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-window {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-window {
            transform: scale(1);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #333;
        }
        .modal-title {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            text-transform: capitalize;
        }
        .modal-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .modal-gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
            transition: transform 0.2s;
        }
        .modal-gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Target Selection Grid matches your code setup -->
    <div class="gallery-grid">
        <div class="gallery-item" onclick="openFolder('bedroom')">
            <span class="folder-title">Master Bedroom Set 6</span>
            <span class="click-hint">Tap to view images</span>
        </div>

        <div class="gallery-item" onclick="openFolder('table')">
            <span class="folder-title">Custom Dining Tables</span>
            <span class="click-hint">Tap to view images</span>
        </div>

        <div class="gallery-item" onclick="openFolder('tv')">
            <span class="folder-title">TV Units & Lounges</span>
            <span class="click-hint">Tap to view images</span>
        </div>
    </div>

    <!-- Interactive Popup Window Markup -->
    <div class="modal-overlay" id="galleryModal" onclick="closeFolder()">
        <div class="modal-window" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeFolder()">&times;</button>
            <h3 class="modal-title" id="modalTitle">Gallery</h3>
            <div class="modal-gallery" id="modalImages">
                <!-- JavaScript handles folder injection here -->
            </div>
        </div>
    </div>

    <!-- Custom Script Engine Engine -->
    <script>
        // 1. Manually map files because GitHub Pages forbids directory index crawling
        const folderDatabase = {
            'bedroom': [
                'elee/bedroom(10).jpeg',
                'elee/bedroom(11).jpeg',
                'elee/bedroom(12).jpeg'
            ],
            'table': [
                'table/table(1).jpeg',
                'table/table(2).jpeg',
                'table/table(3).jpeg'
            ],
            'tv': [
                'tv/unit(1).jpg',
                'tv/unit(2).jpg'
            ]
        };

        // 2. Open Folder Window Controller
        function openFolder(folderName) {
            const modal = document.getElementById('galleryModal');
            const titleElement = document.getElementById('modalTitle');
            const imagesContainer = document.getElementById('modalImages');

            // Setup display text
            titleElement.innerText = folderName + " Collection";
            imagesContainer.innerHTML = ''; // Wipe past loaded images

            const activeImages = folderDatabase[folderName];

            if (activeImages && activeImages.length > 0) {
                // Populate popup with mapped directory elements 
                activeImages.forEach(imagePath => {
                    const img = document.createElement('img');
                    img.src = imagePath;
                    img.alt = folderName + " item";
                    // Handle load failure gracefully
                    img.onerror = function() { this.style.display = 'none'; }; 
                    imagesContainer.appendChild(img);
                });
            } else {
                imagesContainer.innerHTML = '<p style="color:#666;">No images mapped for this category yet.</p>';
            }

            // Animate popup display window
            modal.classList.add('active');
        }

        // 3. Close Folder Window Controller
        function closeFolder() {
            document.getElementById('galleryModal').classList.remove('active');
        }
    </script>
</body>
</html>
